<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Room Reservation - Test Form</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --accent: #d97706;
      --bg: #f8fafc;
      --text: #0f172a;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .booking-card {
      background: #ffffff;
      width: 100%;
      max-width: 540px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      border: 1px solid #e2e8f0;
    }
    h2 {
      margin-top: 0;
      color: var(--primary);
      font-size: 1.5rem;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1);
    }
    .row {
      display: flex;
      gap: 16px;
    }
    .row .form-group {
      flex: 1;
    }
    button {
      background-color: var(--primary);
      color: #ffffff;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #1e40af;
    }
    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
      font-size: 0.9rem;
    }
    .alert-success { background: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
    .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
  </style>
</head>
<body>

<div class="booking-card">
  <h2>🏨 Reserve Your Stay</h2>
  <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Fill in the details below to request a room booking.</p>

  <div id="statusAlert" class="alert"></div>

  <form id="hotelBookingForm">
    <!-- Honeypot -->
    <input type="text" name="_gotcha" style="display:none;" tabindex="-1" autocomplete="off">

    <div class="form-group">
      <label>Full Guest Name *</label>
      <input type="text" name="guest_name" placeholder="e.g. Vikramaditya Singh" required>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Email Address *</label>
        <input type="email" name="email" placeholder="guest@example.com" required>
      </div>
      <div class="form-group">
        <label>Phone / WhatsApp *</label>
        <input type="tel" name="phone" placeholder="+91 9876543210" required>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Check-in Date *</label>
        <input type="date" name="check_in" required>
      </div>
      <div class="form-group">
        <label>Check-out Date *</label>
        <input type="date" name="check_out" required>
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label>Room Category *</label>
        <select name="room_type">
          <option value="Deluxe Heritage Room">Deluxe Heritage Room</option>
          <option value="Super Deluxe River View">Super Deluxe River View</option>
          <option value="Executive Luxury Suite">Executive Luxury Suite</option>
          <option value="Royal Family Suite">Royal Family Suite</option>
        </select>
      </div>
      <div class="form-group">
        <label>Number of Guests *</label>
        <select name="guests">
          <option value="1">1 Adult</option>
          <option value="2" selected>2 Adults</option>
          <option value="3">3 Adults</option>
          <option value="4">4 Adults / Family</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>Special Requests (Optional)</label>
      <textarea name="special_requests" rows="3" placeholder="e.g. Airport pickup required, vegetarian breakfast, late arrival..."></textarea>
    </div>

    <button type="submit" id="submitBtn">Submit Reservation Request</button>
  </form>
</div>

<script>
  document.getElementById('hotelBookingForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const alertBox = document.getElementById('statusAlert');
    
    btn.disabled = true;
    btn.textContent = 'Submitting Request...';
    alertBox.style.display = 'none';

    const formData = new FormData(this);
    const payload = Object.fromEntries(formData.entries());

    try {
      const response = await fetch('/api/bookings.php', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok && data.ok) {
        alertBox.className = 'alert alert-success';
        alertBox.textContent = data.message || 'Reservation received successfully!';
        alertBox.style.display = 'block';
        this.reset();
      } else {
        alertBox.className = 'alert alert-error';
        const errMsgs = data.errors ? Object.values(data.errors).join(' ') : (data.error || 'Failed to process reservation.');
        alertBox.textContent = errMsgs;
        alertBox.style.display = 'block';
      }
    } catch (err) {
      alertBox.className = 'alert alert-error';
      alertBox.textContent = 'Network error or server unavailable. Please try again.';
      alertBox.style.display = 'block';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Submit Reservation Request';
    }
  });
</script>

</body>
</html>
